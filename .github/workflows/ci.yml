name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build & Test Backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npx ng build --configuration production

  docker-compose:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i 's/change_me_root/ci_root_pass/' .env
          sed -i 's/change_me/ci_pass/' .env

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for backend API to be ready..."
          READY=false
          for i in $(seq 1 90); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200/api/auth/login 2>/dev/null || echo "000")
            echo "  Attempt $i: HTTP $CODE"
            if [ "$CODE" != "000" ] && [ "$CODE" -ge 200 ] && [ "$CODE" -lt 500 ]; then
              echo "Backend is ready!"
              READY=true
              break
            fi
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "FAIL: Backend did not become ready in time"
            exit 1
          fi

      - name: Smoke test – Auth & API
        run: |
          echo "=== 1. Verify unauthenticated request is rejected ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200/api/game/saves)
          if [ "$HTTP_CODE" -ne 401 ] && [ "$HTTP_CODE" -ne 403 ]; then
            echo "FAIL: Expected 401 or 403 but got $HTTP_CODE"
            exit 1
          fi
          echo "PASS: Unauthenticated request correctly rejected ($HTTP_CODE)"

          echo "=== 2. Register a test user ==="
          REGISTER_RESPONSE=$(curl -s -X POST http://localhost:4200/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_smoke_user","password":"CiSmokePass123!"}')
          echo "Register response: $REGISTER_RESPONSE"

          TOKEN=$(echo "$REGISTER_RESPONSE" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "FAIL: Could not extract JWT token from register response"
            exit 1
          fi
          echo "PASS: Registered successfully, token obtained"

          echo "=== 3. Access protected endpoint with JWT ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            http://localhost:4200/api/game/saves)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "FAIL: Authenticated request returned $HTTP_CODE"
            exit 1
          fi
          echo "PASS: Authenticated request succeeded (200)"

          echo "=== All smoke tests passed ==="

      - name: Cleanup
        if: always()
        run: docker compose down -v
